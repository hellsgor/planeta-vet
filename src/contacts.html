<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/images/footer-logo-image.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="/js/main.js" defer></script>
    <title>Контакты</title>
  </head>
  {{> svgSprite}}
  <body>
    {{> sections/header data=header}}
    <main>
      {{> sections/hero this.hero}}
      {{> sections/ contacts this.contacts}}
      {{> sections/path-to-success}}
    </main>
    {{> sections/footer data=footer}}
    {{> modals}}
    <script>
      initMap();

async function initMap() {
    // Промис `ymaps3.ready` будет зарезолвлен, когда загрузятся все компоненты основного модуля API
    await ymaps3.ready;
    
    const {YMap, YMapDefaultSchemeLayer,YMapDefaultFeaturesLayer} = ymaps3;
    const {YMapDefaultMarker} = await ymaps3.import('@yandex/ymaps3-default-ui-theme');
    const {YMapDefaultMarkerProps} = await ymaps3.import('@yandex/ymaps3-default-ui-theme');
    const {YMapHint, YMapHintContext} = await ymaps3.import('@yandex/ymaps3-hint@0.0.1');
    // Иницилиазируем карту
    const map = new YMap(
        // Передаём ссылку на HTMLElement контейнера
        document.getElementById('map'),

        // Передаём параметры инициализации карты
       
           { location: {
                // Координаты центра карты
                center: [37.546210, 55.732920],

                // Уровень масштабирования
                zoom: 10
            },},
            [
            // Add a map scheme layer
            new YMapDefaultSchemeLayer({}),
            // Add a layer of geo objects to display the markers
            new YMapDefaultFeaturesLayer({})
          ]

        
    );

    // Добавляем слой для отображения схематической карты
    map.addChild(new YMapDefaultSchemeLayer());
    const hint = new YMapHint({hint: (object = {
  coordinates: [37.546210, 55.732920],
  color: 'red',
  size: 'normal',
  iconName: 'fallback',
  properties: {
    hint: {
      title: 'Title of that pop up',
      text: 'Some useful information about a place. You can add whatever you want: pictures, buttons, different headings.'
    }
  }
}) => object?.properties?.hint});
          map.addChild(hint);
  //   map.addChild(new YMapHint({
  //             coordinates: [37.546210, 55.732920],
  //             title: 'North America',
  //   subtitle: 'The biggest amount of islands',
  //   color: 'lavender',
  //   size: 'normal',
  //   iconName: 'fallback'
  //           }
      
  //   )
  // )


}

    </script>
  </body>
</html>
