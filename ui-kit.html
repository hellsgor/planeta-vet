<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./images/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI-KIT</title>
    <script type="module" crossorigin src="./js/main.js"></script>
    <link rel="stylesheet" crossorigin href="./styles/style.css">
  </head>
  <body>
    <main>

      <section class="ui-kit">
          <button
            class="button"
            
            
            
            
            
          >
            <div class="button__wrapper">
              <span class="button__text">Кнопка</span>
            </div>
          </button>
          <button
            class="button button_big"
            
            
            
            
            
          >
            <div class="button__wrapper">
              <span class="button__text">Кнопка со шрифтом побольше</span>
            </div>
          </button>
          <button
            class="button button_white"
            
            
            
            
            
          >
            <div class="button__wrapper">
              <span class="button__text">Белая Кнопка</span>
            </div>
          </button>
       


        <div class="form-control">
        
          <input 
            class="form-control__input"
             type="text" 
             
            placeholder="Плейсхолдер"
            
            
            
            
          >
        
          <p class="form-control__error"></p>
        </div>
        <div class="form-control">
        <input 
          class="form-control__input"
          type="checkbox" 
          
          
        >
        <div class="form-control__indicator"></div>
        <label 
        
        >
         Чекбокс 
        </label>
        </div>
        <div class="form-control">
        <input 
          class="form-control__input"
          type="radio" 
          
          
        >
        <div class="form-control__indicator"></div>
        <label 
        
        >
         Радио 
        </label>
        </div>
     
      </section>
      <!-- /.ui-kit -->
  

    </main>
    
  </body>
</html>
